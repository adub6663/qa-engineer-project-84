- summary: |
    В списке категорий отсутствует пункт для возврата к полному списку товаров 
  environment: |
    Google Chrome 147.0.7727.117 (офиуиальная сборка) (64 бит)
    Firefox 150.0.1 (64-разрядный)
  steps-to-reproduce: |
    1. Зайти на страницу интернет-магазина
    2. Перейти к списку с категориями
    3. Выбрать любую категорию
    4. Попытаться вернуться к отображению всех товаров 
  expected-result: |
    В списке категорий присутствует пустая строка, пункт "сбросить категорию" или аналогичные пункты
  actual-result: |
    В списке категорий отсутствует пункт для возврата ко всем товарам. После выбора категории нет возможности вернуться к полному списку товаров

