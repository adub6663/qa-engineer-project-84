---
- summary: |
   Поиск не находит товар при вводе названия на русском языке 
  environment: |
   Google Chrome 147.0.7727.117 (офиуиальная сборка) (64 бит)
   Firefox 150.0.1 (64-разрядный)
  steps-to-reproduce: |
    1. Открыть страницу интернет-магазина
    2. Убедиться, что язык интерфеса установлен на русском
    3. Ввести в поисковую строку название товара на русском языке
  expected-result: |
    Должен отобразиться искомый товар
  actual-result: |
    Отображается сообщение "ничего не найдено"

