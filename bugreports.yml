- summary: |
    Магазин не адаптирован для мобильных устройств
  environment: |
    Google Chrome 147.0.7727.117 (офиуиальная сборка) (64 бит)
  steps-to-reproduce: |
    1. Открыть страницу интернет-магазина на мобильном утстройстве или в DevTools
    2. Визуально оценить отображение страницы  
  expected-result: |
    Интерфейс адаптирован для мобильных устройств
  actual-result: |
    Интерфейс не адаптирован для мобильных устройств. Надписи вылазят за пределы своих границ, список товаров сполз вниз, общее отображение страницы нарушено
    Ошибка изображена на скриншотах mobile-not-responsive1.jpg, mobile-not-responsive2.jpg 

