- summary: |
   При смене языка интерфейса с английского на русский переводится только часть элементов интерфейса 
  environment: |
    Google Chrome 147.0.7727.117 (офиуиальная сборка) (64 бит)
    Firefox 150.0.1 (64-разрядный) 
  steps-to-reproduce: |
    1. Зайти на страницу интернет-магазина
    2. Убедиться, что текущий язык интерфейса английский
    3. Переключить язык интерфейса на русский
    4. Проанализировать элементы интерфейса на странице
  expected-result: |
    Все элементы интерфейса переводятся на русский язык. Интерфейс выглядит локализованным без смешения языков
  actual-result: |
    После переключения на русский язык переведены только некоторые элементы

- summary: |
    При возвращении в каталог со страницы товара выбранные фильтры сбрасываются
  environment: |
    Google Chrome 147.0.7727.117 (офиуиальная сборка) (64 бит)
    Firefox 150.0.1 (64-разрядный) 
  steps-to-reproduce: |
    1. Зайти на страницу интернет-магазина
    2. Установить один или несколько фильтров
    3. Открыть любой товариз отфильтрованного списка
    4. Вернуться в каталог магазина
  expected-result: |
    При возвращении в каталог ранее выбранные фильтры сохраняются. Список товаров отображаются с учетом этих фильтров
  actual-result: |
    При возвращении в каталог все ранее выбранные фильтры сбрасываются. Отображается полный список товаров без учета фильтрации

- summary: |
    При удалении товара из корзины отсутствует окно подтверждения удаления
  environment: |
    Google Chrome 147.0.7727.117 (офиуиальная сборка) (64 бит)
    Firefox 150.0.1 (64-разрядный) 
  steps-to-reproduce: |
    1. Зайти на страницу интернет-магазина
    2. Добавить любой товар в корзину
    3. Перейти на страницу корзины
    4. Нажать "Удалить"
  expected-result: |
    Перед удалением товара появляется модальное окно с запросом подтверждения
  actual-result: |
    Товар удаляется из корзины мгновенно, без подтверждения

- summary: |
    Кнопка "В корзину" у некоторых товаров имеет некорректный размер
  environment: |
    Google Chrome 147.0.7727.117 (офиуиальная сборка) (64 бит)
    Firefox 150.0.1 (64-разрядный) 
  steps-to-reproduce: |
    1. Зайти на страницу интернет-магазина
    2. Визуально сравнить кнопки "В корзину" у разных товаров на одной странице
  expected-result: |
