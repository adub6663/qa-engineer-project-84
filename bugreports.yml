  environment: |
   Google Chrome 147.0.7727.117 (офиуиальная сборка) (64 бит)
   Firefox 150.0.1 (64-разрядный) 
  steps-to-reproduce: |
    1. Зайти на страницу интернет-магазина
    2. Найти "Категории"
    3. Выбрать категорию "Продукты"
    4. Проанализировать список отображенных товаров
  expected-result: |
    В списке товаров отображаются только товары, относящиеся к категории "продукты"
  actual-result: |
