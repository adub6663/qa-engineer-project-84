---
- summary: |
     Поиск товаров по ключевому слову
  requirement: |
     Пользователь должен иметь возможность искать товары по ключевому слову или категории
  prerequisites: |
     Открыт каталог интернет-магазина
  test-data: |
    - Ключевое слово для поиска (на русском): "смартфон"
    - Ключевое слово для поиска (на английском): "smartphone"
  steps:
    - Ввести в поле ключевое слово "смартфон"
    - Зафиксировать результат 
    - Очистить поле поиска
    - Ввести запрос "smartphone"
  expected-result: |
     Оба запроса должны находить товар

- summary: |
    Поиск товаров по категории  
  requirement: |
    Пользователь должен иметь возможность искать товары по ключевому слову или категории
  prerequisites:
    Открыт каталог интернет-магазина
  test-data: |
     Категория "Продукты"
  steps:
    - Выбрать категорию "Продукты"
    - Нажать на неё
  expected-result: |
     Отображается страница с товарами только из категории "Продукты", без товаров из других категорий

- summary: |
    Проверка фильтрации товаров с ценой в заданном диапазоне
  requirement: |
    Пользователь должен иметь возможность фильтровать товары
  prerequisites: |
    Открыт каталог интернет-магазина
  test-data: |
    Минимальная цена: 7$
    Максимальная цена:14$
  steps:
    - В поле "Цена от" ввести 7$
    - В поле "Цена до" ввести 14$
  expected-result: |
    Показаны только товары с ценой от 7$ до 14$. Товары дешевле 7$ и дороже 14$ отсутствуют

- summary: |
    Применение двух фильтров одновременно
  requirement: |
    Пользователь должен иметь возможность фильтровать товары
  prerequisites: |
    Открыт каталог интернет-магазина.
  test-data: |
    Цена до: 200$
    Бренд: Dior
  steps:
    - Выбрать категорию "Ароматы"
    - Задать фильтр "Цена до 200$"
    - Выбрать бренд "Dior"
  expected-result: |
    Отобразились только товары бренда Dior с ценой до 200$. Товары других брендов или дороже не показаны

- summary: |
     Проверка перехода на страницу подробной информации из списка товаров
  requirement: |
     Пользователь должен иметь возможность просматривать товары и просматривать подробную информацию о товаре
  prerequisites: |
     Открыт каталог интернет-магазина. Есть товар "Наушники"
  test-data: |
     Товар: "Наушники Apple"
  steps:
    - В списке товаров найти "Наушники Apple"
    - Кликнуть по названию или изображения товара
  expected-result: |
    Переход на страницу подробной информации из списка товаров
    Открылась отдельная страница товара с подробным описанием, ценой, характеристиками

- summary: |
    Проверка, что подробная информация содержит ключевые поля
  requirement: |
    Пользователь должен иметь возможность просматривать товары и просматривать подробную информацию о товаре
  prerequisites: |
    Открыта страница товара "Смартфон iPhone" со всеми характеристиками
  test-data: |
    Товар: "Смартфон iPhone"
  steps:
    - Пролистать до блока "Характерисики"
  expected-result: |
    Отображаются ключевые характеристики

- summary: |
    Проверка добавление товара в корзину через карточку товара
  requirement: |
    Пользователь должен иметь возможность добавлять товары в корзину и просматривать содержимое корзины
  prerequisites: |
    Открыта страница любого товара
  test-data: |
    Товар: "Наушники" 
  steps:
    - На странице товара нажать кнопку "Добавить в корзину"
    - Нажать на корзину в шапке сайта
  expected-result: |
    В корзине отображается добавленный товар

- summary: |
   Проверка смены языка интерфейса с русского на английский
  requirement: |
   Пользователь должен иметь возможность переключить язык интерфейса
  prerequisites: |
    Текущий язык интерфейса - русский. Есть переключатель языков
  test-data: |
    Текст страницы на русском языке
  steps:
    - Кликнуть по переключателю языков
    - Выбрать "English"
    - Перейти в карточку любого товара
    - Добавить товар в корзину
    - Перейте на страницу корзины
    - Нажать кнопку "Оформить заказ"
  expected-result: |
    Интерфейс переключился на английский

- summary: |
   Проверка смены языка интерфейса с английского на русский
  requirement: |
   Пользователь должен иметь возможность переключить язык интерфейса
  prerequisites: |
    Текущий язык интерфейса - английский. Есть переключатель языков
  test-data: |
    Текст страницы на английском языке
  steps:
    - Кликнуть по переключателю языков
    - Выбрать "Russian"
    - Перейти в карточку любого товара
    - Добавить товар в корзину
    - Перейте на страницу корзины
    - Нажать кнопку "Оформить заказ"
  expected-result: |
    Интерфейс переключился на русский

- summary: |
   Проверка отображения общей информации товаров в каталоге
  requirement: |
    На странице товара и в каталоге должно выводиться название, рейтинг, цена со скидкой и без нее.
  prerequisites: |
    Открыт каталог интернет-магазина
  test-data: |
    Список всех товаров
  steps:
    - Визуально оценить карточки товаров
  expected-result: |
    В карточках товаров отображаются название, рейтинг, цена со скидкой и без нее

 - summary: |
    Проверка фильтрации товаров по производителю
  requirement: |
     Пользователь должен иметь возможность фильтровать товары
  prerequisites: |
    Открыт каталог интернет-магазина
  test-data: |
    Фильтр по производителю: Dior
  steps:
    - Выбрать производителя "Dior"
  expected-result: |
    В каталоге отображаются только товары производителя "Dior"

  - summary: |
    Проверка фильтрации товаров по чекбоксу "В наличии"
  requirement: |
     Пользователь должен иметь возможность фильтровать товары
  prerequisites: |
    Открыт каталог интернет-магазина. На странице каталога чекбокс "В наличиии" отмечен
  test-data: |
    Товар "Смартфон" - в наличии
    Товар "Чехол" - нет в наличии
  steps:
    - Визуально просмотреть список товаров
    - Снять флажок "В наличии"
  expected-result: |
    При установленном чекбоксе отображаются только товары, которые есть в наличии. При снятом чекбоксе - все товары без исключения

  - summary: |
    Проверка удаления товара из корзины
  requirement: |
    На странице корзины пользователь cможет удалить товар из корзины и продолжить выбирать товары в каталоге
  prerequisites: |
    Открыта страница корзины. В корзине есть товар
  test-data: |
    Товар "Наушники"
  steps:
    - Нажать кнопку "Удалить"
  expected-result: |
    Товар исчезает из списка товаров в корзине

- summary: |
    Проверка очистки корзины и перехода на страницу каталога
  requirement: |
    На странице корзины пользователь cможет удалить товар из корзины и продолжить выбирать товары в каталоге
  prerequisites: |
    Открыта страница корзины. В корзине есть товар
  test-data: |
    Товары "Наушники", "Чехол","Помада"
  steps:
    - Нажать кнопку "Очистить корзину"
    - Нажать кнопку "Магазин"
  expected-result: |
    Все товары удалены из корзины. Корзина пуста. После нажатия "Магазин" выполнен переход на страницу каталога
    
  - summary: |
   Проверка добавления нескольких одинаковых товаров в корзину
  requirement: |
    Пользователь должен иметь возможность добавлять товары в корзину и просматривать содержимое корзины
  prerequisites: |
    Открыт каталог интернет-магазина
  test-data: |
    Товар "Тушь"
  steps:
    - Открыть страницу товара
    - Нажать кнопку "В корзину"
    - Установить количество
  expected-result: |
    В корзине отображается товар с установленным количеством 

    - summary: |
   Проверка добавления нескольких разных товаров в корзину
  requirement: |
    Пользователь должен иметь возможность добавлять товары в корзину и просматривать содержимое корзины
  prerequisites: |
    Открыт каталог интернет-магазина
  test-data: |
    Товар "Тушь"
    Товар "Духи"
    Товар "Наушники"
  steps:
    - Добавить в корзину выбранные товары
  expected-result: |
    В корзине отображаются все выбранные товары

  - summary: |
   Проверка оформления заказа из корзины с переходом на страницу оплаты
  requirement: |
   Пользователь на странице корзины может оформить заказ с переходом на страницу оплаты
  prerequisites: |
    Открыта страница корзины и в ней есть товар
  test-data: |
   Товар "Чехол"
  steps:
    - Нажать кнопку "Оформить заказ"
    - Заполнить обязательные поля
    - Выбрать способ оплаты
    - Нажать кнопку "Оплатить"
  expected-result: |
   Происходит переход на страницу оплаты
 
  - summary: |
   Проверка постраничного вывода товаров в каталоге
  requirement: |
    Пользователь будет просматривать каталог товаров, пользуясь постраничным выводом.
  prerequisites: |
    Открыт каталог интернет-магазина
  test-data: |
    На странице несколько товаров
  steps:
    - Нажать кнопку "Следующая"
  expected-result: |
   При переходе на следующую страницу отображаются новые товары

  - summary: |
    Проверка перехода в категорию по хэштегу на странице товара
  requirement: |
    Пользователь должен иметь возможность искать товары по ключевому слову или категории
  prerequisites: |
    Открыта страница товара
  test-data: |
    Товар "Масло"
    Хэштег "Продукты"
  steps:
    - Нажать на хэштег
  expected-result: |
    Произошел переход на страницу каталога. На странице отображаются только товары категории "Продукты"
  
  - summary: |
   Проверка, что все запросы на странице интернет-магазина успешны
  requirement: |
    
  prerequisites: |
    Открыта страница интернет-магазина. Открыт DevTools на вкладке Network
  test-data: |
    Базовый URL интернет-магазина
  steps:
    - Обновить страницу
    - Проверить статус всех запросов
    - Перейти на страницу карточки товара и проверить статус
    - Повторить для страницы корзины
  expected-result: |
    Нет запросов с ошибками
