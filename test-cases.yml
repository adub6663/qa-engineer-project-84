---
- summary: |
     Поиск товаров по ключевому слову: успешное отображение релевантных резельтатов
  requirement: |
     Пользователь должен иметь возможность искать товары по ключевому слову или категории
  prerequisites: |
     Открыт каталог интернет-магазина
  test-data: |
    - Ключевое слово для поиска: "смартфон"
    - Ожидаемые товары: "Смартфон iPhone", "Смартфон Samsung"
    - Товары, не соответствующие запросу: "Чехол", "Наушники"
  steps:
    - Найти поле ввода для поиска
    - Ввести в поле ключевое слово "смартфон"
    - Проанализировать список отображенных товаров на странице 
  expected-result: |
     Отображается страница с результатами поиска. В списке результатов присутствуют только товары, содержащие слово "смартфон". Товары, не релевантные запросу, не отображаются. При отсутствии товаров по запросу должно отображаться сообщение "Ничего не найдено"

- summary: |
    Поиск товаров по категории  
  requirement: |
    Пользователь должен иметь возможность искать товары по ключевому слову или категории
  prerequisites:
    Открыт каталог интернет-магазина
  test-data: |
     Категория "Продукты"
  steps:
    - Найти список категорий
    - Выбрать категорию "Продукты"
    - Нажать на неё
  expected-result: |
     Отображается страница с товарами только из категории "Продукты", без товаров из других категорий

- summary: |
    Фильтрация товаров с ценой в заданном диапазоне
  requirement: |
    Пользователь должен иметь возможность фильтровать товары
  prerequisites: |
    Открыт каталог интернет-магазина
  test-data: |
    Минимальная цена: 7$
    Максимальная цена:14$
  steps:
    - Найти блок с фильтрами
    - В поле "Цена от" ввести 7$
    - В поле "Цена до" ввести 14$
    - Проанализировать список отображенных товаров на странице
  expected-result: |
    Показаны только товары с ценой от 7$ до 14$. Товары дешевле 7$ и дороже 14$ отсутствуют

- summary: |
    Применение двух фильтров одновременно
  requirement: |
    Пользователь должен иметь возможность фильтровать товары
  prerequisites: |
    Открыт каталог интернет-магазина.
  test-data: |
    Цена до: 200$
    Бренд: Dior
  steps:
    - Найти список категорий
    - Выбрать категорию "Ароматы"
    - Задать фильтр "Цена до 200$"
    - Выбрать бренд "Dior"
    - Проанализировать список отображенных товаров
  expected-result: |
    Отобразились только товары бренда Dior с ценой до 200$. Товары других брендов или дороже не показаны

- summary: |
     Переход на страницу подробной информации из списка товаров
  requirement: |
     Пользователь должен иметь возможность просматривать товары и просматривать подробную информацию о товаре
  prerequisites: |
     Открыт каталог интернет-магазина. Есть товар "Наушники"
  test-data: |
     Товар: "Наушники Apple"
  steps:
    - В списке товаров найти "Наушники Apple"
    - Кликнуть по названию или изображения товара
  expected-result: |
    Открылась отдельная страница товара с подробным описанием, ценой, характеристиками

- summary: |
    Проверка, что подробная информация содержит ключевые поля
  requirement: |
    Пользователь должен иметь возможность просматривать товары и просматривать подробную информацию о товаре
  prerequisites: |
    Открыта страница товара "Смартфон iPhone" со всеми характеристиками
  test-data: |
    Товар: "Смартфон iPhone"
  steps:
    - Пролистать до блока "Характерисики"
    - Проанализировать характеристики
  expected-result: |
    Отображаются ключевые характеристики

- summary: |
    Добавление товара в корзину через карточку товара
  requirement: |
    Пользователь должен иметь возможность добавлять товары в корзину и просматривать содержимое корзины
  prerequisites: |
    Открыта страница любого товара
  test-data: |
    Товар: "Наушники" 
  steps:
    - На странице товара нажать кнопку "Добавить в корзину"
    - Нажать на корзину в шапке сайта
  expected-result: |
    В корзине отображается добавленный товар

- summary: |
   Смена языка интерфейса с русского на английский
  requirement: |
   Пользователь должен иметь возможность переключить язык интерфейса
  prerequisites: |
    Текущий язык интерфейса - русский. Есть переключатель языков
  test-data: |
    Текст страницы на русском языке
  steps:
    - Кликнуть по переключателю языков
    - Выбрать "English"
    - Посмотреть на страницу
  expected-result: |
    Интерфейс переключился на английский

- summary: |
   Смена языка интерфейса с английского на русский
  requirement: |
   Пользователь должен иметь возможность переключить язык интерфейса
  prerequisites: |
    Текущий язык интерфейса - английский. Есть переключатель языков
  test-data: |
    Текст страницы на английском языке
  steps:
    - Кликнуть по переключателю языков
    - Выбрать "English"
    - Посмотреть страницу
  expected-result: |
    Интерфейс переключился на английский
