bugreports:
- summary: |
    После выбора категории кнопка возврата на предыдущую страницу продолжает листать каталог без учета выбранной категории
  environment: |
    Google Chrome 147.0.7727.117 (офиуиальная сборка) (64 бит)
    Firefox 150.0.1 (64-разрядный)
  steps-to-reproduce: |
    1. Зайти на страницу интернет-магазина
    2. Пролистать до страницы, с нужным товаром
    3. Выбрать нужную категорию
    4. Убедиться, что в каталоге остались только товары из выбранной категории
    5. Нажать на кнопку "Предыдущая"
  expected-result: |
    Кнопка возврата на предыдущую страницу должна учитывать выбранную категорию
  actual-result: |
    После выбора категории кнопка возврата на предыдущую страницу продолжает листать каталог без учета выбранной категории

- summary: |
    При нажатии на кнопку "Магазин" со страницы корзины происходит перезагрузка страницы вместо обычного перехода
  environment: |
    Google Chrome 147.0.7727.117 (офиуиальная сборка) (64 бит)
    Firefox 150.0.1 (64-разрядный)
  steps-to-reproduce: |
    1. Зайти на страницу интернет-магазина 
    2. Перейти на страницу корзины
    3. Нажать на кнопку "Магазин"
  expected-result: |
    При нажатии на кнопку "Магазин" происходит обычный переход на страницу каталога без перезагрузки страницы
  actual-result: |
    При нажатии на кнопку "Магазин" со страницы корзины происходит перезагрузка страницы

- summary: |
    При выставлении диапазона цен строка с ценами вытягивается в сторону из-зи некоторых чисел
  environment: |
    Google Chrome 147.0.7727.117 (офиуиальная сборка) (64 бит)
    Firefox 150.0.1 (64-разрядный)
  steps-to-reproduce: |
    1. Зайти на страницу интернет-магазина
    2. Найти фильтр с ценами
    3. Ввести в поле диапазона цен определенные числа
    4. Визуально оценить поведение строки с отображением цен
  expected-result: |
    Строка с отображением цен должна сохранять свою ширину и структуру независимо от введенных чисел
  actual-result: |
    При вводе некоторых чисел строка с ценами вытягивается в сторону
    Ошибка изображена на скриншоте price-range-overflow.png

