- summary: |
    После очистки корзины кнопкоц "Очистить корзину" товары восстанавливаются при переходе на страницу каталога через кнопку "Магазин"
  environment: |
    Google Chrome 147.0.7727.117 (офиуиальная сборка) (64 бит)
    Firefox 150.0.1 (64-разрядный)
  steps-to-reproduce: |
    1. Зайти на страницу интернет-магазина
    2. Добавить товары в корзину
    3. Перейти на страницу корзины
    4. Нажать кнопку "Очистить корзину"
    5. Нажать кнопку "Магазин"
  expected-result: |
    Корзина должна оставаться пустой после очистки, независимо от последующих действий
  actual-result: |
    Сразу после нажатия "Очистить корзину" товары исчезают, но после перехода на страницу каталога через кнопку "Магазин" товары восстанавливаются
