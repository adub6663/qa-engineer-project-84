- summary: |
    При удалении товара из корзины элементы интерфейса дергаются/смещаются
  environment: |
    Google Chrome 147.0.7727.117 (офиуиальная сборка) (64 бит)
    Firefox 150.0.1 (64-разрядный)
  steps-to-reproduce: |
    1. Зайти на страницу интернетмагазина
    2. Добавить несколько товаров в корзину
    3. Перейти на страницу корзины
    4. Обратить внимание на положение кнопок "Очистить корзину", "Продолжить покупки и слово "Сумма"
    5. Удалить несколько товаров и визуально оценить поведение элементов
  expected-result: |
    При удалении товаров из корзины элементы интерфейса остаются на своих местах
  actual-result: |
    При удалении товара из корзины элементы дергаются

- summary: |
    При нажатии на кнопку "Магазин" со страницы корзины язык интерфейса переключается с русского на английский
  environment: |
    Google Chrome 147.0.7727.117 (офиуиальная сборка) (64 бит)
    Firefox 150.0.1 (64-разрядный)
  steps-to-reproduce: |
    1. Зайти на страницу интернет-магазина
    2. Переключить язык интерфейса на русский
    3. Перейти на страницу корзины
    4. Убедиться, что интерфейс корзины отображается на русском
    5. Нажать на кнопку "Магазин"
  expected-result: |
    При нажатии на кнопку "Магазин" открывается страница магазина на русском языке
  actual-result: |
    При нажатии на кнопку "Магазин" открывается страница магазина на английском языке

